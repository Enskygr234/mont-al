plugins {
    id "com.android.application"
}

android {
    namespace "tr.montal.app"
    compileSdk 34

    defaultConfig {
        applicationId "tr.montal.app"
        minSdk 26
        targetSdk 34
        def calismaNo = System.getenv("GITHUB_RUN_NUMBER") ?: "1"
        versionCode = Integer.parseInt(calismaNo)
        versionName = "1.0." + calismaNo
    }

    // Sabit anahtar: yeni APK eskisinin üzerine güncelleme olarak kurulur
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
