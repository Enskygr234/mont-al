name: Veriyi güncelle

on:
  schedule:
    # Her gece 03:17 (Türkiye saati) = 00:17 UTC
    - cron: "17 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: EGO ve OpenStreetMap verisini çek
        run: |
          set -o pipefail
          if ! python -u scripts/veri_cek.py 2>&1 | tee veri.log; then
            ozet=$(tail -40 veri.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Veri çekilemedi::${ozet}"
            # Bağlantı teşhisi: EGO sitesi GitHub sunucularından erişilebilir mi?
            for u in https://www.ego.gov.tr/ https://www.ego.gov.tr/hareketsaatleri; do
              sonuc=$(curl -sS -m 20 -o /dev/null -w "%{http_code} %{time_total}s" "$u" 2>&1 || true)
              echo "::warning title=Bağlantı testi::$u -> $sonuc"
            done
            exit 1
          fi
          echo "::notice title=Veri güncellendi::$(tail -1 veri.log)"

      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "durakta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Veri güncellendi: $(date -u +%Y-%m-%d)"
            git push
          fi
