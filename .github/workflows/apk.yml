name: APK derle

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK derle
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle.log; then
            # Hata özetini görünür bir uyarı olarak yaz (Actions sayfasının üstünde çıkar)
            ozet=$(grep -E -A15 "What went wrong|error:|e: |FAILURE" gradle.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle hatası::${ozet}"
            exit 1
          fi

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk mont-al.apk

      - name: Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Mont Al 1.0.${{ github.run_number }}
          make_latest: true
          files: mont-al.apk
          body: |
            Telefondan `mont-al.apk` dosyasını indirip kur.
            İlk kurulumda Android "bilinmeyen kaynaklardan yüklemeye izin ver" diye sorar, izin ver.
