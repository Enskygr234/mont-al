plugins {
    id "com.android.application"
}

android {
    namespace "tr.durakta.app"
    compileSdk 34

    defaultConfig {
        applicationId "tr.durakta.app"
        minSdk 26
        targetSdk 34
        // GitHub Actions çalışma numarasından otomatik sürüm
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    // Sabit debug anahtarı: her yeni APK eskisinin üzerine güncelleme olarak kurulabilsin.
    // (Debug anahtarları gizli değildir; Play Store için ayrı bir anahtar gerekir.)
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
